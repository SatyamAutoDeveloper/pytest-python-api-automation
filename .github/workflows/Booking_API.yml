name: Booking API Tests
permissions:
  contents: read

on:
  workflow_dispatch:


jobs:
  Booking_API_Tests:
    runs-on: ubuntu-latest

    env:
      API_USERNAME: ${{ secrets.BOOKING_API_USERNAME }}
      API_PASSWORD: ${{ secrets.BOOKING_API_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run API tests
        run: |
          pytest tests/test_booking_api.py --alluredir=allure-results
        continue-on-error: true

      - name: Generate Allure Report
        uses: simple-actions/allure-report-action@v2
        id: allure-report
        with:
          # The directory where the raw results from Step 4 are stored
          allure_results: allure-results
          # The directory where the final HTML report will be generated
          report_path: allure-report
          # Use a GitHub Pages branch to host the report (optional, but good practice)
          gh_pages: gh-pages

      - name: Archive raw Allure results
        uses: actions/upload-artifact@v4
        with:
          name: raw-allure-results
          path: allure-results

      - name: Upload Allure HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report
          path: allure-report
          retention-days: 7
